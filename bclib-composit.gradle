plugins {
	id 'idea'
	id 'eclipse'
	id 'maven-publish'
	id 'java-library'
	id 'net.neoforged.moddev' version "${moddev_version}"
}
def componentGradleProperties = new Properties()
def componentGradlePropertiesFile = file('gradle.properties')
if (!componentGradlePropertiesFile.exists()) {
    throw new GradleException("Missing component gradle.properties: ${componentGradlePropertiesFile}")
}
componentGradlePropertiesFile.withInputStream { stream ->
    componentGradleProperties.load(stream)
}
componentGradleProperties.each { key, value ->
    project.extensions.extraProperties.set(key.toString(), value)
}

apply from: "bclib.gradle"
